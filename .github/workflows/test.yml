name: CI

permissions: {}

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fix 1: Reverted to the stable, verified v4 checkout tool with explicit recursive submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Fix 2: Explicitly force forge to index remappings before running deep formatting checks
      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      # Added an absolute build path pass to ensure openzeppelin libraries compile cleanly
      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
